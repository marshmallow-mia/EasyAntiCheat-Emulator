name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Release-EOS]
        platform: [Win32, x64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Build
      run: msbuild EasyAntiCheat.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EasyAntiCheat-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          ${{ matrix.platform }}/${{ matrix.configuration }}/*.dll
          ${{ matrix.platform }}/${{ matrix.configuration }}/*.pdb
        if-no-files-found: warn
